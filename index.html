<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <!-- Theme -->
    <meta name="theme-color" content="#f1e7d8" />
    <meta name="color-scheme" content="light" />

    <!-- Primary SEO -->
    <title>Adinu — Frontend Developer</title>

    <meta
      name="description"
      content="Adinu — Frontend Developer building responsive, modern web experiences with React, TypeScript and modern web tools."
    />

    <meta
      name="keywords"
      content="Adinu, frontend developer, React developer, React.js, TypeScript, JavaScript, web developer, frontend development, portfolio"
    />

    <meta name="author" content="Adinu" />

    <meta name="robots" content="index, follow" />

    <link
      rel="canonical"
      href="https://adinu-dev.vercel.app/"
    />

    <!-- Favicon / Brand Mark -->
    <link
      rel="icon"
      href="/adinu-logo.svg"
      type="image/svg+xml"
    />

    <!-- PNG fallback -->
    <link
      rel="alternate icon"
      href="/adinu-logo.png"
      type="image/png"
    />

    <!-- Apple Touch Icon -->
    <link
      rel="apple-touch-icon"
      href="/adinu-logo.png"
    />

    <!-- Open Graph -->
    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:title"
      content="Adinu — Frontend Developer"
    />

    <meta
      property="og:description"
      content="Frontend Developer building responsive, modern web experiences with React, TypeScript and modern web tools."
    />

    <meta
      property="og:url"
      content="https://adinu-dev.vercel.app/"
    />

    <meta
      property="og:site_name"
      content="Adinu"
    />

    <meta
      property="og:image"
      content="https://adinu-dev.vercel.app/adinu-logo.png"
    />

    <meta
      property="og:image:alt"
      content="Adinu — Frontend Developer"
    />

    <!-- Twitter / X -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="Adinu — Frontend Developer"
    />

    <meta
      name="twitter:description"
      content="Frontend Developer building responsive, modern web experiences with React, TypeScript and modern web tools."
    />

    <meta
      name="twitter:image"
      content="https://adinu-dev.vercel.app/adinu-logo.png"
    />

    <meta
      name="twitter:image:alt"
      content="Adinu — Frontend Developer"
    />

    <!-- Fonts -->
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div id="app"></div>

    <script
      type="module"
      src="/src/main.js"
    ></script>
  </body>
</html>
